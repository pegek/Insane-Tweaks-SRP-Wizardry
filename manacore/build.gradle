apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
    mavenCentral()
}

version = '0.4.0'
group = 'com.spege.manacore'
archivesBaseName = 'manacore'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation 'zone.rong:mixinbooter:7.1'
    // Same coordinate insanetweaks and reskilltweaks use. Do NOT add an EBW jar to libs/.
    implementation fg.deobf('curse.maven:ElectroblobsWizardry-265642:8320066')
    // TaB: the mixin names the MagicStats type in its signature, so the jar must be deobfuscated.
    implementation fg.deobf(files(rootProject.file('libs/Trinkets and Baubles-Forge-1.12.2-0.33.3.jar')))
    // The `core` package contains no Minecraft types at all, so it can be tested on a plain JVM.
    testImplementation 'junit:junit:4.12'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Mana Core",
            "Specification-Vendor": "spege",
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
