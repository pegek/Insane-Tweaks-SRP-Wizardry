modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/spege/tombtweaks"

[[mods]]
modId="tombtweaks"
version="${file.jarVersion}"
displayName="TombTweaks"
authors="spege"
description='''
Tweaks for Corail Tombstone: items return to the slots they came from, unvisited graves slowly decay, and the magic books get a cooldown.
'''

[[dependencies.tombtweaks]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tombtweaks]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tombtweaks]]
    modId="tombstone"
    mandatory=true
    # Zweryfikowane tylko na 9.1.4. Mixiny sa required + defaultRequire 1, wiec wersja,
    # ktora zmieni serverTick / canEnchant / wywolanie setEnchant, wywali gre przy ladowaniu
    # klasy - lepiej, zeby Forge odmowil startu z czytelnym komunikatem o zaleznosci.
    versionRange="[9.1.4,9.2)"
    ordering="AFTER"
    side="BOTH"

# Konfiguracja mixinow NIE jest tu deklarowana: FML 47 nie czyta [[mixins]] (to wlasnosc
# NeoForge). Rejestruje ja atrybut MixinConfigs w manifescie jara, dopisywany przez
# MixinGradle z bloku mixin { config ... } w build.gradle.
