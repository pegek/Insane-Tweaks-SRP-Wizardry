apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

version = '1.9.1'
group = 'com.spege.tombtweaks'
archivesBaseName = 'tombtweaks'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // Four deobf compile-only jars, one per integration this mod names types from:
    //   tombstone       — the mod being tweaked (perks, capability, events, EffectHelper)
    //   Reskillable     — the inventory tab strip the Knowledge tab hangs off
    //   BaublesEX       — the bauble slots the grave restore writes back into
    //   Enigmatic Legacy— the three EnigmaticConfigs constants the Cursed Ring redirects read,
    //                     plus ItemBaseBauble/ItemCursedRing for the armour-relief handler's
    //                     signature. Its mixins still use string targets.
    implementation fg.deobf('curse.maven:corail-tombstone-243707:8643174')
    implementation fg.deobf('curse.maven:reskillable-fork-976391:5117948')
    implementation fg.deobf('curse.maven:baubles-ex-1096600:8500331')
    implementation fg.deobf('curse.maven:enigmatic-legacy-legacy-1055212:8575610')

    // Electroblob's Wizardry — the ItemWand type and WandHelper, for soulbinding a wand with a
    // grave's soul. Same CurseMaven coordinate as content and every other mod here.
    implementation fg.deobf('curse.maven:ElectroblobsWizardry-265642:8320066')

    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Tombstone Tweaks",
            "Specification-Vendor": "spege",
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
