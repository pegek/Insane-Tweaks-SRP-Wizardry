apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

version = '1.0.0'
group = 'com.spege.tombtweaks'
archivesBaseName = 'tombtweaks'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // Four deobf compile-only jars, one per integration this mod names types from:
    //   tombstone       — the mod being tweaked (perks, capability, events, EffectHelper)
    //   Reskillable     — the inventory tab strip the Knowledge tab hangs off
    //   BaublesEX       — the bauble slots the grave restore writes back into
    //   Enigmatic Legacy— the three EnigmaticConfigs constants the Cursed Ring redirects read.
    //                     Its mixins use string targets, so only these field reads need it.
    implementation fg.deobf(files(rootProject.file('libs/tombstone-1.12.2-4.7.6.jar')))
    implementation fg.deobf(files(rootProject.file('libs/Reskillable-1.12.2-1.13.1.jar')))
    implementation fg.deobf(files(rootProject.file('libs/BaublesEX-1.12.2-2.3.4.jar')))
    implementation fg.deobf(files(rootProject.file('libs/enigmaticlegacy-legacy-2.6.0.jar')))

    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Tombstone Tweaks",
            "Specification-Vendor": "spege",
            "Specification-Version": "1.0.0",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
