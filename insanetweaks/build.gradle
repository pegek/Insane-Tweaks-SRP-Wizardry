apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

version = '1.13.1'
group = 'com.spege.insanetweaks'
archivesBaseName = 'insanetweaks'

// mcmod.info niesie wersje, ktora Forge pokazuje w liscie modow i wpisuje do logow.
// Byla tam wklepana na sztywno i zamarzla na 1.11.0 - jar 1.12.0 meldowal sie
// w logu serwera jako "insanetweaks{1.11.0}", wiec po wersji z logu NIE DALO SIE
// stwierdzic, czy ktos ma poprawiony plik. Dokladnie tak samo wczesniej rozjechalo sie
// Specification-Version (stalo na 1.9.4 przy wersji 1.9.5).
// Jedno zrodlo prawdy: 'version' powyzej.
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory rootProject.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory rootProject.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // Doomlike Dungeons stays srpwizcore-only (Builder null-map guard). Ice and Fire USED to be
    // excluded here for the same reason, but the dragonsteel nunchaku need it: CompatLoadUtil
    // comes from Ice and Fire and RLDragonsteel's DragonsteelHitEffect references its dragon
    // entity types.
    implementation fg.deobf(fileTree(dir: rootProject.file('libs'), include: '*.jar', exclude: ['ElectroblobsWizardry-*.jar', 'dldungeonsjbg-*.jar']))
    implementation fg.deobf('curse.maven:ElectroblobsWizardry-265642:8320066')

    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "insanetweaks SRP&Wizardry",
            "Specification-Vendor": "spege",
            // Derived, not literal: this was hardcoded and drifted to 1.9.4 while version said 1.9.5.
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.insanetweaks.json,mixins.insanetweaks.compat.json,mixins.insanetweaks.early.json",

            // Deklaracja coremodu. BEZ NIEJ jar wywala start serwera na czystym Forge
            // (DuplicateModsFoundException) - pelne uzasadnienie w EarlyMixinBooter.
            // Skrocone: 'MixinConfigs' powoduje, ze MixinBooter dokłada jar na classloader,
            // a Forge znajduje go wtedy dwa razy - w mods/ i na classpath. Pomija tylko to,
            // co jest w getIgnoredMods()/getReparseableCoremods(), a tam trafiaja wylacznie
            // coremody. 'ContainsFMLMod' kieruje jar do candidateModFiles zamiast
            // ignoredModFiles, wiec @Mod laduje sie normalnie.
            // ZADNEGO TweakClass obok - Forge pomija wtedy coremod.
            "FMLCorePlugin": "com.spege.insanetweaks.core.EarlyMixinBooter",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${rootProject.projectDir}/mcmodsrepo"
        }
    }
}
