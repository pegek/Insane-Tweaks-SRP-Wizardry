apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// settings.gradle lists this project first, so ':srpwizmixins' has no sourceSets yet when the
// dependencies block below reaches for its classes directory. reskilltweaks gets away with the same
// trick only because it happens to be included last; saying it out loud is order-independent.
evaluationDependsOn(':srpwizmixins')

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

version = '1.20.3'
group = 'com.spege.insanetweaks'
archivesBaseName = 'insanetweaks'

// mcmod.info niesie wersje, ktora Forge pokazuje w liscie modow i wpisuje do logow.
// Byla tam wklepana na sztywno i zamarzla na 1.11.0 - jar 1.12.0 meldowal sie
// w logu serwera jako "insanetweaks{1.11.0}", wiec po wersji z logu NIE DALO SIE
// stwierdzic, czy ktos ma poprawiony plik. Dokladnie tak samo wczesniej rozjechalo sie
// Specification-Version (stalo na 1.9.4 przy wersji 1.9.5).
// Jedno zrodlo prawdy: 'version' powyzej.
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory rootProject.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory rootProject.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    // Every mod this one names a type from, pinned to the exact CurseForge file the pack ships.
    // Used to be a fileTree over a local, git-ignored libs/ folder; that classpath was whatever
    // happened to sit in the folder, so a fresh clone could not build. Add a line here (and only
    // here) when the code starts importing from another mod.
    //   SRP            - parasite types, configs and events (most of the integration)
    //   Ancient Spellcraft, Spartan Weaponry, Better Survival - spellblades, aegis, nunchaku
    //   Ice and Fire   - CompatLoadUtil; RLDragonsteel's DragonsteelHitEffect names its dragons
    //   RLDragonsteel  - the dragonsteel nunchaku
    //   BaublesEX      - BaubleTypeEx and the bauble registries/attributes
    //   Locks, JEI     - the optional LocksCompat and the JEI plugin
    //   Morph Spell Pack (Rise of the Animagus) - one instanceof ILichSpell in NpcCastVetoArbiter;
    //                    not in the pack, the check only runs when the mod is loaded
    // Doomlike Dungeons and JourneyMap stay off this classpath on purpose (srpwizcore- and
    // srpwizmixins-only), so nothing here can couple to them by accident.
    implementation fg.deobf('curse.maven:scape-and-run-parasites-348025:8787918')
    implementation fg.deobf('curse.maven:ancient-spellcraft-358124:8555709')
    implementation fg.deobf('curse.maven:spartan-weaponry-278141:6839689')
    implementation fg.deobf('curse.maven:better-survival-mod-260360:5729552')
    implementation fg.deobf('curse.maven:iceandfire-rlcraft-888556:8350620')
    implementation fg.deobf('curse.maven:rldragonsteel-1234346:7280687')
    implementation fg.deobf('curse.maven:baubles-ex-1096600:8500331')
    implementation fg.deobf('curse.maven:locks-253456:3568569')
    compileOnly 'curse.maven:jei-238222:5846804'
    compileOnly 'curse.maven:rise-of-the-animagus-690655:7266002'
    implementation fg.deobf('curse.maven:ElectroblobsWizardry-265642:8320066')

    // Meteor placement guard: this mod hands srpwizmixins a ProtectedAreaProvider so the parasite
    // meteor never lands on a sanctuary. The dependency runs content -> extracted mod, which is the
    // allowed direction; srpwizmixins knows nothing about sanctuaries and stays shippable alone.
    //
    // 'sourceSets.main.output', NOT 'project(":srpwizmixins")' - same reason as the reskilltweaks
    // edge: that project has jar.finalizedBy('reobfJar'), so its JAR carries SRG names and
    // ProtectedAreaProvider.isProtected(World, BlockPos) would not link in dev. The classes
    // directory is never reobfuscated.
    compileOnly project(':srpwizmixins').sourceSets.main.output

    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "insanetweaks SRP&Wizardry",
            "Specification-Vendor": "spege",
            // Derived, not literal: this was hardcoded and drifted to 1.9.4 while version said 1.9.5.
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.insanetweaks.json,mixins.insanetweaks.compat.json,mixins.insanetweaks.early.json",

            // Deklaracja coremodu. BEZ NIEJ jar wywala start serwera na czystym Forge
            // (DuplicateModsFoundException) - pelne uzasadnienie w EarlyMixinBooter.
            // Skrocone: 'MixinConfigs' powoduje, ze MixinBooter dokłada jar na classloader,
            // a Forge znajduje go wtedy dwa razy - w mods/ i na classpath. Pomija tylko to,
            // co jest w getIgnoredMods()/getReparseableCoremods(), a tam trafiaja wylacznie
            // coremody. 'ContainsFMLMod' kieruje jar do candidateModFiles zamiast
            // ignoredModFiles, wiec @Mod laduje sie normalnie.
            // ZADNEGO TweakClass obok - Forge pomija wtedy coremod.
            "FMLCorePlugin": "com.spege.insanetweaks.core.EarlyMixinBooter",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${rootProject.projectDir}/mcmodsrepo"
        }
    }
}
