plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin'   version '0.7.+'
}

version = '0.1.0'
group   = 'com.spege.tombtweaks'
base { archivesName = 'tombtweaks-1.20.1' }

// NIE dodawaj -proc:none. Mixinowy annotation processor musi dzialac, bo
// MixinBlockDecorativeGrave celuje w metode Minecrafta i potrzebuje refmapy.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tombtweaks { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tombtweaks { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'tombtweaks.refmap.json'
    config 'mixins.tombtweaks.json'
}

repositories {
    mavenCentral()
    // Tombstone jest "All rights reserved", wiec jego jar NIE moze trafic do repo.
    // CurseMaven serwuje dokladnie ten sam plik co CurseForge.
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    // 47.3.19, nie nizej: Tombstone 9.1.4 wola ResourceLocation.fromNamespaceAndPath, ktore Forge
    // dostal dopiero w 47.3.19 (backport metod z 1.21). Na 47.2.x Tombstone wywraca sie juz przy
    // rejestracji (NoSuchMethodError w PreciseMagicArrowFunction.<clinit>) - choc sam deklaruje
    // forge [47,). Sprawdzone na serwerze dedykowanym 2026-10-02: 47.2.20 crash, 47.3.19 i
    // 47.4.26 startuja. Trzymaj to zgodne z versionRange forge w mods.toml.
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.19'

    // Tombstone: deobf jest konieczny, bo referencje do MC w jego bajtkodzie sa SRG-owe.
    // Koordynat: curse.maven:<slug>-<projectId>:<fileId>. 243707 = corail-tombstone,
    // 8606942 = plik "Corail Tombstone 9.1.4 for 1.20.1". Zweryfikowane sha256 -
    // artefakt z CurseMaven jest bajt w bajt tym samym plikiem co jar z CurseForge.
    // UWAGA: fg.deobf(files(...)) NIE dziala na ForgeGradle 6 - cicho podsuwa
    // zaobfuskowany jar (to jest skladnia FG3).
    implementation fg.deobf('curse.maven:corail-tombstone-243707:8606942')

    // Procesor adnotacji Mixin - MixinGradle 0.7 NIE dodaje go sam. Bez tej linii build jest
    // cichy i zielony, ale jar wychodzi bez refmapy, a redirect w MixinBlockDecorativeGrave
    // (cel: metoda Minecrafta `use`, w runtime `m_6227_`) wywala gre przy pierwszym zaladowaniu
    // klasy. runClient tego NIE pokaze, bo w dev nazwy sa oficjalne - wychodzi dopiero
    // w prawdziwej instancji. Dowod, ze dziala: tombtweaks.refmap.json w build/libs/*.jar.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// core ma sie przenosic kopiuj-wklej do portu na 1.16.5, czyli Java 8. Toolchain 17 przepusci
// var, List.of czy rekord bez slowa - to zadanie kompiluje sam core z --release 8
// i wywala `check`, gdy core przestanie byc Java 8.
tasks.register('compileCoreJava8', JavaCompile) {
    source = fileTree('src/main/java') { include 'com/spege/tombtweaks/core/**' }
    classpath = files()
    // Zadanie wlasne nie dziedziczy toolchaina projektu (Gradle chodzi na JDK 8, ktory nie zna
    // --release), wiec kompilator wskazujemy jawnie.
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    destinationDirectory = layout.buildDirectory.dir('core-java8')
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.named('check') { dependsOn 'compileCoreJava8' }

tasks.withType(JavaCompile).configureEach {
    // NIE dodawaj tu -proc:none - patrz notatka na gorze tego pliku.
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'TombTweaks',
            'Specification-Vendor'  : 'spege',
            'Specification-Version' : "${version}",
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor' : 'spege'
        ])
    }
}
