apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

version = '1.9.1'
group = 'com.spege.srpwizcore'
archivesBaseName = 'srpwizcore'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    // OTG compile-only (deobf) — the 3 OTG mixins reference com.pg85.otg.* classes.
    // FutureMC needs NO jar (string target + vanilla redirect); EntityTracker is vanilla.
    implementation fg.deobf(files(rootProject.file('libs/OpenTerrainGenerator-1.12.2-v9.7.jar')))
    // Ice&Fire compile-only (deobf) — MixinIandfStructureGenerator redirects reads of
    // IceAndFireConfig$WorldGenConfig fields, so the handler signatures need that type.
    implementation fg.deobf(files(rootProject.file('libs/IceAndFire-1.12.2-2.2.9.jar')))
    // Doomlike Dungeons: compileOnly, NOT deobf — the referenced signatures
    // (MapMatrix.buildInChunk(Dungeon,int,int), field Dungeon.map) contain no MC types, so
    // nothing on them needs remapping. CQR and Raids need no jar at all (string targets).
    compileOnly files(rootProject.file('libs/dldungeonsjbg-1.14.17-MC1.12.2.jar'))
    // Spartan Weaponry deobf — MixinSwItemCrossbow targets ItemCrossbow by class and the
    // shoot helper calls vanilla-inherited methods on EntityBolt (reobf remaps them).
    implementation fg.deobf(files(rootProject.file('libs/SpartanWeaponry-1.12.2-1.6.1.jar')))
    // CQR compileOnly, NOT deobf — only the IRangedWeapon interface is referenced (its
    // descriptors contain class names only, which SRG never renames). The gear-swap mixin
    // still targets CQR by string.
    compileOnly files(rootProject.file('libs/Chocolate_Quest_Repoured-1.12.2-2.8.0B.jar'))
    // EBW compileOnly — never called: javac needs ISpellCaster resolvable because
    // AbstractEntityCQR (used for setHealingPotions in the gear swap) implements it.
    compileOnly files(rootProject.file('libs/ElectroblobsWizardry-4.3.19.jar'))
    // No Enigmatic Legacy jar here any more: the Non-Euclidean Cube crash guard was retired in
    // 1.9.0 because Enigmatic Legacy 2.7.0 rewrote the search itself (see MixinElItemTheCube in
    // git history). BaublesEX went with it — it was only on the classpath so javac could resolve
    // ItemSpellstoneBauble's IBauble while completing the ItemTheCube symbol.
    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "SRP&WIZ Core",
            "Specification-Vendor": "spege",
            "Specification-Version": "1.9.1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.srpwizcore.early.json,mixins.srpwizcore.intcache.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
