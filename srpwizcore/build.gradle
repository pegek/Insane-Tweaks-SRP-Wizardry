apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

version = '1.15.1'
group = 'com.spege.srpwizcore'
archivesBaseName = 'srpwizcore'

// mcmod.info takes its version from build.gradle instead of a literal. A hand-typed one froze
// twice already (insanetweaks 1.12.0 reported itself as 1.11.0 in the log), which is exactly the
// kind of drift that makes a support log unreadable. Same shape as insanetweaks (commit 73f0704).
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    // OTG compile-only (deobf) — the 3 OTG mixins reference com.pg85.otg.* classes.
    // FutureMC needs NO jar (string target + vanilla redirect); EntityTracker is vanilla.
    implementation fg.deobf('curse.maven:open-terrain-generator-265894:7004304')
    // Ice&Fire compile-only (deobf) — MixinIandfStructureGenerator redirects reads of
    // IceAndFireConfig$WorldGenConfig fields, so the handler signatures need that type.
    implementation fg.deobf('curse.maven:iceandfire-rlcraft-888556:8350620')
    // Doomlike Dungeons: compileOnly, NOT deobf — the referenced signatures
    // (MapMatrix.buildInChunk(Dungeon,int,int), field Dungeon.map) contain no MC types, so
    // nothing on them needs remapping. CQR and Raids need no jar at all (string targets).
    compileOnly 'curse.maven:doomlike-dungeons-74246:8122642'
    // Spartan Weaponry deobf — MixinSwItemCrossbow targets ItemCrossbow by class and the
    // shoot helper calls vanilla-inherited methods on EntityBolt (reobf remaps them).
    implementation fg.deobf('curse.maven:spartan-weaponry-278141:6839689')
    // Spartan Fire deobf — the findAmmo mixins call ItemDragonBolt.findDragonBoneBolt and read
    // EntityDragonBolt's type; both signatures carry MC types, so SRG names have to be remapped.
    implementation fg.deobf('curse.maven:spartan-fire-rlcraft-edition-676392:6774250')
    // CQR compileOnly, NOT deobf — only the IRangedWeapon interface is referenced (its
    // descriptors contain class names only, which SRG never renames). The gear-swap mixin
    // still targets CQR by string.
    compileOnly 'curse.maven:cqrepoured-303422:7237428'
    // EBW compileOnly — never called: javac needs ISpellCaster resolvable because
    // AbstractEntityCQR (used for setHealingPotions in the gear swap) implements it.
    compileOnly 'curse.maven:ElectroblobsWizardry-265642:8320066'
    // No Enigmatic Legacy jar here any more: the Non-Euclidean Cube crash guard was retired in
    // 1.9.0 because Enigmatic Legacy 2.7.0 rewrote the search itself (see MixinElItemTheCube in
    // git history). BaublesEX went with it — it was only on the classpath so javac could resolve
    // ItemSpellstoneBauble's IBauble while completing the ItemTheCube symbol.
    // WorseHurtTimer compileOnly, NOT deobf — the four mixin targets (Events.getHurtTime,
    // Events.getHurtResistantTime, Events.onAttackEntityFromPre, BHTAPI.get) and the
    // HurtSourceInfo$HurtSourceData handler parameter are all plain mod members. Their
    // descriptors carry MC *class* names only, which SRG never renames, so nothing needs
    // remapping. PreLivingAttackEvent extends Forge's Event directly, not LivingEvent.
    compileOnly 'curse.maven:worse-hurt-timer-1079060:6496071'
    // BaublesEX compileOnly, NOT deobf — only BaublesApi.isBaubleEquipped(EntityPlayer, Item)
    // is called; a Baubles method name with MC class names in its descriptor, nothing to remap.
    compileOnly 'curse.maven:baubles-ex-1096600:8500331'
    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "SRP&WIZ Core",
            "Specification-Vendor": "spege",
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.srpwizcore.early.json,mixins.srpwizcore.intcache.json",
            // Short version: 'MixinConfigs' makes MixinBooter add the jar to the classloader,
            // Forge then finds it twice (classpath + mods/) and throws
            // DuplicateModsFoundException on plain Forge. Declaring the jar a coremod puts its
            // name on the list both mechanisms consult. Full account in SrpWizCoreEarlyBooter.
            // NO TweakClass beside this - Forge skips a coremod that declares both.
            "FMLCorePlugin": "com.spege.srpwizcore.core.SrpWizCoreEarlyBooter",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
