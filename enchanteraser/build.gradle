apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

version = '1.3.0'
group = 'com.spege.enchanteraser'
archivesBaseName = 'enchanteraser'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-proc:none"
    options.compilerArgs << "-Xlint:all"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    // No deobf jars: every vanilla target is compiled against Forge itself, and the one third-party
    // mixin (Infernal Mobs) uses a string target, so it names no type from that mod.
    //
    // JEI API for the ingredient blacklist. compileOnly and deliberately NOT deobf: the four members
    // used (@JEIPlugin, IModPlugin.register, IJeiHelpers.getIngredientBlacklist,
    // IIngredientBlacklist.addIngredientToBlacklist) name no Minecraft type, so nothing needs
    // remapping - same reasoning as srpwizcore's dldungeonsjbg. Runtime is HEI, whose IModPlugin has
    // extra methods; they are all `default`, so compiling against the older API is forward-compatible.
    compileOnly files(rootProject.file('libs/jei_1.12.2-4.16.1.1013.jar'))
    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Enchant Eraser",
            "Specification-Vendor": "spege",
            "Specification-Version": "1.3.0",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "spege",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // Vanilla targets => early. The jar manifest is the ONLY working early route; CleanMix
            // silently ignores IEarlyMixinLoader. The Infernal Mobs config is late (mod-gated) and is
            // queued by EnchantEraserLateBooter instead.
            "MixinConfigs": "mixins.enchanteraser.early.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url "file:///${rootProject.projectDir}/mcmodsrepo" } }
}
